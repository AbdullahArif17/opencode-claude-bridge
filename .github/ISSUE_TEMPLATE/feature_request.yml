name: Feature request
description: Suggest an improvement for ClaudeZen
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    valid: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    valid: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    valid: true
